name: CD

on:
  push:
    branches: [test]

permissions:
  contents: read
  id-token: write  # for OIDC if you switch to role-based auth

env:
  TF_VERSION: "1.9.0"
  AWS_REGION: us-east-1
  YOUR_NAME: rabindra

jobs:
  build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    outputs:
      agent_uri: ${{ steps.push-agent.outputs.image_uri }}
      embedding_uri: ${{ steps.push-embedding.outputs.image_uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Push agent image
        id: push-agent
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          aws ecr create-repository \
            --repository-name ember-agent \
            --region ${{ env.AWS_REGION }} 2>/dev/null || true
          IMAGE_URI="${ECR_REGISTRY}/ember-agent:${{ github.sha }}"
          docker build -t "$IMAGE_URI" docker/agent/
          docker push "$IMAGE_URI"
          # also tag as latest
          docker tag "$IMAGE_URI" "${ECR_REGISTRY}/ember-agent:latest"
          docker push "${ECR_REGISTRY}/ember-agent:latest"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Push embedding image
        id: push-embedding
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          aws ecr create-repository \
            --repository-name ember-embedding \
            --region ${{ env.AWS_REGION }} 2>/dev/null || true
          IMAGE_URI="${ECR_REGISTRY}/ember-embedding:${{ github.sha }}"
          docker build -t "$IMAGE_URI" docker/embedding/
          docker push "$IMAGE_URI"
          docker tag "$IMAGE_URI" "${ECR_REGISTRY}/ember-embedding:latest"
          docker push "${ECR_REGISTRY}/ember-embedding:latest"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: build-push
    defaults:
      run:
        working-directory: terraform
    environment: production  # enables manual approval gate — configure in repo settings

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
            -backend-config="key=${{ secrets.TF_BACKEND_KEY }}" \
            -backend-config="region=${{ secrets.TF_BACKEND_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Terraform Plan
        run: |
          terraform plan -out=tfplan -input=false \
            -var="your_name=${{ env.YOUR_NAME }}"

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false tfplan
